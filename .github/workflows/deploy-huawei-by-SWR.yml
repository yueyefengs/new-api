name: Deploy to Huawei Cloud (SWR)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: swr.cn-north-9.myhuaweicloud.com
  SWR_REGION: cn-north-9
  SWR_REPOSITORY: panshiyuxugong
  APP_NAME: new-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.SWR_REPOSITORY }}/${{ env.APP_NAME }}" >> ${GITHUB_ENV}

      - name: Log in to Huawei Cloud SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | docker login -u ${{ env.SWR_REGION }}@${{ secrets.SWR_ACCESS_KEY_ID }} ${{ env.REGISTRY }} --password-stdin

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.SWR_REPOSITORY }}/${{ env.APP_NAME }}:latest" >> ${GITHUB_ENV}

      - name: Ensure target directory and read compose file
        run: |
          echo "COMPOSE_CONTENT<<EOF_COMPOSE" >> $GITHUB_ENV
          cat docker-compose-online.yml >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF_COMPOSE" >> $GITHUB_ENV

      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SWR_AK: ${{ secrets.SWR_ACCESS_KEY_ID }}
          SWR_PWD: ${{ secrets.SWR_PASSWORD }}
          SWR_REGION: ${{ env.SWR_REGION }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          COMPOSE_CONTENT: ${{ env.COMPOSE_CONTENT }}
        with:
          host: ${{ secrets.SERVER_HOST_HUAWEIYUN }}
          username: ${{ secrets.SERVER_USER_HUAWEIYUN }}
          password: ${{ secrets.SERVER_PASSWORD_HUAWEIYUN }}
          key: ${{ secrets.SERVER_SSH_KEY_HUAWEIYUN }}
          envs: SWR_AK,SWR_PWD,SWR_REGION,IMAGE_NAME,REGISTRY,COMPOSE_CONTENT
          command_timeout: 120m
          script: |
            mkdir -p ~/new-api/data ~/new-api/logs
            cd ~/new-api

            # Write docker-compose-online.yml from environment
            echo "$COMPOSE_CONTENT" > docker-compose-online.yml

            # 登录华为云 SWR
            echo "$SWR_PWD" | docker login $REGISTRY -u $SWR_REGION@$SWR_AK --password-stdin || true
            
            # 拉取最新镜像
            docker pull $IMAGE_NAME
            
            # 使用环境变量执行 docker-compose 重启
            touch .env
            IMAGE_NAME=$IMAGE_NAME docker-compose -f docker-compose-online.yml up -d
            
            # 清理无用镜像
            docker image prune -f
